# ArcanaEngine runtime — deployed by the deploy-target as THREE coexisting projects:
#   arcanaengine-dev         on DEV_PORT  (automatic: every dev-<sha8> tag push)
#   arcanaengine-pre-release on PRE_PORT  (automatic: every master-<sha8> tag push)
#   arcanaengine-prod        on PROD_PORT (rbowen's promotion only — same
#                                          digest, retagged, from the
#                                          pre-release record)
# TAG + PORT are injected by the deployer from THIS repo's deploy/ports.env.
# Redeploy of a project = replace (compose convergence), not a second instance.
services:
  app:
    image: registry.divinearts.co.uk/arcanaengine:${TAG:?set by deployer}
    restart: unless-stopped
    ports:
      - "${PORT:?set by deployer}:8080"
    environment:
      # global error envelope (UnhandledExceptionHandler): exception `detail` in
      # 500 bodies defaults OFF when ASPNETCORE_ENVIRONMENT=Production. The
      # override lives in the canonical env file (~/.secrets/service-env/
      # arcanaengine.env), never in git — see development-instructions/
      # API-ERROR-ENVELOPE.md.
      Diagnostics__IncludeExceptionDetail: "${DIAGNOSTICS_INCLUDEEXCEPTIONDETAIL:-}"
