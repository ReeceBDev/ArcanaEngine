# ArcanaEngine runtime — ONE project per repo (rbowen's model):
#   master merge → dev deployment (automatic) on DEV_PORT
#   rbowen promotes → SAME project moves to prod on PROD_PORT
# TAG + PORT injected by the deployer from this repo's deploy/ports.env.
# Redeploy of the same project = replace (compose convergence), not a second instance.
services:
  app:
    image: registry.divineapps.co.uk:5000/arcanaengine:${TAG:?set by deployer}
    restart: unless-stopped
    ports:
      - "${PORT:?set by deployer}:8080"
