# ArcanaEngine runtime — deployed by the deploy-target as TWO coexisting projects:
#   arcanaengine-dev  on DEV_PORT  (automatic: every dev-*/master-* tag push)
#   arcanaengine-prod on PROD_PORT (rbowen's promotion only — same digest, retagged)
# TAG + PORT are injected by the deployer from THIS repo's deploy/ports.env.
# Redeploy of a project = replace (compose convergence), not a second instance.
services:
  app:
    image: registry.divinearts.co.uk/arcanaengine:${TAG:?set by deployer}
    restart: unless-stopped
    ports:
      - "${PORT:?set by deployer}:8080"
